<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat - Your Smart Teacher</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main-content">
        <div class="chat-layout">
          <header class="page-header" style="margin-bottom: 18px;">
            <div>
              <p class="eyebrow">AI Tutor</p>
              <h1>AI Learning Assistant</h1>
            </div>
          </header>

          <p class="text-secondary mb-20">Ask anything about your document</p>

          <div class="chat-toolbar">
            <button class="suggested-q" data-question="Explain convolution simply">Explain convolution simply</button>
            <button class="suggested-q" data-question="What's the difference between Sobel and Canny?">What's the difference between Sobel and Canny?</button>
            <button class="suggested-q" data-question="Summarize this chapter">Summarize this chapter</button>
            <button class="suggested-q" data-question="Give me an example of Gaussian blur">Give me an example of Gaussian blur</button>
          </div>

          <div class="chat-wrapper">
            <div class="chat-history" id="chatHistory">
              <div class="chat-msg ai-msg">
                Hello! I’m ready to answer questions based on the uploaded <strong>Computer Vision Fundamentals</strong> document. What would you like to know?
              </div>
            </div>

            <div class="chat-input-area">
              <input type="text" id="chatInput" placeholder="Ask a question about the document..." />
              <button class="btn-primary" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chat.js"></script>
  </body>
</html>
