<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Map - AI Learning Navigator</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  </head>
  <body>
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main-content">
        <div class="page-header">
          <div>
            <p class="eyebrow">Learning Path</p>
            <h1>Interactive Learning Map</h1>
          </div>
          <button class="btn-primary" onclick="window.location.href='learning.html?lesson=image-filtering'">
            <i class="fas fa-play"></i> Start Active Topic
          </button>
        </div>

        <div class="mindmap-shell">
          <div class="mindmap-stage card" id="mindmapContainer"></div>
          <aside class="card mindmap-panel" id="topicDetails"></aside>
        </div>
      </main>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/mindmap.js"></script>
  </body>
</html>
